<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      min-height: 200px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      border-radius: 8px;
      box-sizing: border-box;
    }
    
    .container {
      border-radius: 8px;
      overflow: hidden;
    }
    
    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .button-mapping {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: #f5f5f5;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .button-name {
      font-weight: 500;
      color: #333;
    }
    
    .button-action {
      color: #666;
      font-size: 14px;
    }
    
    .status {
      padding: 12px;
      background-color: #e8f5e8;
      border-radius: 6px;
      color: #2d5a2d;
      text-align: center;
      font-size: 14px;
    }
    
    .note {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 12px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Controller Navigator</h1>
    
    <div class="section">
      <div class="status" id="status">
        Checking for controller...
      </div>
    </div>
    
    <div class="section">
      <h3>Button Mappings:</h3>
      <div class="button-mapping">
        <span class="button-name">A Button</span>
        <span class="button-action">Enter/Click</span>
      </div>
      <div class="button-mapping">
        <span class="button-name">B Button</span>
        <span class="button-action">Escape/Back</span>
      </div>
      <div class="button-mapping">
        <span class="button-name">LB (L1)</span>
        <span class="button-action">Shift+Tab</span>
      </div>
      <div class="button-mapping">
        <span class="button-name">RB (R1)</span>
        <span class="button-action">Tab</span>
      </div>
      <div class="button-mapping">
        <span class="button-name">D-Pad</span>
        <span class="button-action">Arrow Keys</span>
      </div>
    </div>
    
    <div class="note">
      Future: Button rebinding support for custom navigation
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
