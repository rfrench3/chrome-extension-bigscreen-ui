<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      min-height: 200px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      border-radius: 8px;
      box-sizing: border-box;
    }
    
    .container {
      border-radius: 8px;
      overflow: hidden;
    }
    
    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
    
    .section {
      margin-bottom: 16px;
    }
    
    .button-mapping {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background-color: #f5f5f5;
      border-radius: 6px;
      margin-bottom: 8px;
    }
    
    .button-name {
      font-weight: 500;
      color: #333;
      min-width: 80px;
    }
    
    .button-action {
      color: #666;
      font-size: 14px;
    }
    
    .action-select {
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: white;
      font-size: 12px;
      min-width: 120px;
    }
    
    .save-button:hover {
      opacity: 0.9;
    }
    
    .status {
      padding: 12px;
      background-color: #e8f5e8;
      border-radius: 6px;
      color: #2d5a2d;
      text-align: center;
      font-size: 14px;
    }
    
    .note {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 12px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Controller Navigator</h1>
    
    <div class="section">
      <div class="status" id="status">
        Checking for controller...
      </div>
    </div>
    
    <div class="section" id="mappings-section">
      <h3>Button Mappings:</h3>
      <div id="loading-mappings" style="text-align: center; color: #666; font-style: italic;">
        Loading button mappings...
      </div>
    </div>
    
    <div class="note">
      Customize button actions using the dropdowns above
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
